
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simcha Booking - Plan Your Jewish Event</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="/logo192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/index.css">
    <script>
      try {
        var savedTheme = localStorage.getItem('simcha_theme_mode');
        if (savedTheme === 'light') {
          document.documentElement.classList.add('light-mode');
        }
        var savedStyle = localStorage.getItem('simcha_style_mode');
        if (savedStyle === 'outline') {
          document.documentElement.classList.add('outline-mode');
        }
      } catch (e) {}
    </script>
    <script type="module">
      const mapsKey = import.meta.env.VITE_GOOGLE_MAPS_PLATFORM_KEY;
      if (mapsKey && typeof mapsKey === 'string' && !mapsKey.startsWith("%") && !window.google?.maps?.places) {
        const script = document.createElement('script');
        script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(mapsKey)}&libraries=places`;
        script.async = false;
        document.head.appendChild(script);
      }
    </script>
  </head>
  <body class="bg-black text-slate-100">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
