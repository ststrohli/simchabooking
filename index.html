
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simcha Booking - Plan Your Jewish Event</title>
    <link id="dynamic-manifest" rel="manifest" href="/manifest.json?v=5">
    <link id="dynamic-favicon" rel="icon" type="image/png" sizes="192x192" href="/favicon.png?v=5">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Simcha Booking">
    <link id="dynamic-apple-icon" rel="apple-touch-icon" href="/apple-touch-icon.png?v=5">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/index.css">
    <script>
      try {
        var activeUid = localStorage.getItem('simcha_active_uid');
        var savedTheme = (activeUid && localStorage.getItem('simcha_theme_mode_' + activeUid)) || localStorage.getItem('simcha_theme_mode') || 'dark';
        if (savedTheme === 'light') {
          document.documentElement.classList.add('light-mode');
        } else {
          document.documentElement.classList.remove('light-mode');
        }
        document.documentElement.classList.remove('outline-mode');
      } catch (e) {}
    </script>
    <script type="module">
      const mapsKey = import.meta.env.VITE_GOOGLE_MAPS_PLATFORM_KEY;
      if (mapsKey && typeof mapsKey === 'string' && !mapsKey.startsWith("%") && !window.google?.maps?.places) {
        const script = document.createElement('script');
        script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(mapsKey)}&libraries=places`;
        script.async = false;
        document.head.appendChild(script);
      }
    </script>
  </head>
  <body class="bg-black text-slate-100">
    <div id="root">
      <main class="min-h-screen bg-black flex flex-col items-center justify-center p-6 select-none" aria-label="Loading Simcha Booking">
        <div class="w-full max-w-md space-y-5 flex flex-col items-center text-center mx-auto">
          <!-- Luxury Triple-Ring Gold Animated Indicator -->
          <div class="relative w-20 h-20 flex items-center justify-center">
            <div class="absolute inset-0 rounded-full border-2 border-[#D4AF37]/20 animate-ping"></div>
            <div class="absolute inset-1 rounded-full border-2 border-[#D4AF37]/25"></div>
            <div class="absolute inset-1 rounded-full border-2 border-transparent border-t-[#D4AF37] border-r-[#D4AF37]/60 animate-spin"></div>
            <div class="w-12 h-12 rounded-full bg-[#D4AF37]/15 border border-[#D4AF37]/40 flex items-center justify-center shadow-[0_0_30px_rgba(212,175,55,0.35)] p-2">
              <img src="/sb-logo-old-gold.png?v=5" alt="Simcha Booking" class="w-6 h-6 object-contain select-none animate-pulse" />
            </div>
          </div>

          <div class="text-center space-y-1.5">
            <p id="static-loader-title" class="text-xs sm:text-sm font-bold font-[Cinzel] text-[#D4AF37] uppercase tracking-[0.25em]">Simcha Celebration Concierge</p>
            <p id="static-loader-sub" class="text-[11px] text-zinc-400">Curating premier verified vendors & experiences...</p>
          </div>

          <!-- Symmetrical Centered Luxury Skeleton Preview -->
          <div class="w-full space-y-2.5 pt-2 opacity-60">
            <div class="h-11 w-full rounded-2xl bg-white/[0.04] border border-[#D4AF37]/20 animate-pulse flex items-center px-4 gap-3">
              <div class="w-6 h-6 rounded-full bg-[#D4AF37]/25 shrink-0"></div>
              <div class="h-2.5 flex-1 rounded-full bg-white/15"></div>
            </div>
            <div class="grid grid-cols-2 gap-2.5">
              <div class="h-11 rounded-2xl bg-white/[0.04] border border-white/10 animate-pulse"></div>
              <div class="h-11 rounded-2xl bg-[#D4AF37]/10 border border-[#D4AF37]/25 animate-pulse"></div>
            </div>
            <div class="h-12 w-full rounded-full bg-[#D4AF37]/20 border border-[#D4AF37]/35 animate-pulse"></div>
          </div>
        </div>
      </main>
      <script>
        try {
          if (window.location.pathname === '/payment-success') {
            var t = document.getElementById('static-loader-title');
            var s = document.getElementById('static-loader-sub');
            if (t) t.textContent = 'Confirming Your Payment';
            if (s) s.textContent = 'Finalizing your confirmed celebration reservation...';
          }
        } catch (e) {}
      </script>
    </div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
