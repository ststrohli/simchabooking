
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simcha Booking - Plan Your Jewish Event</title>
    <link id="dynamic-manifest" rel="manifest" href="/manifest.json?v=5">
    <link id="dynamic-favicon" rel="icon" type="image/png" sizes="192x192" href="/favicon.png?v=5">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Simcha Booking">
    <link id="dynamic-apple-icon" rel="apple-touch-icon" href="/apple-touch-icon.png?v=5">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/index.css">
    <script>
      try {
        var activeUid = localStorage.getItem('simcha_active_uid');
        var savedTheme = (activeUid && localStorage.getItem('simcha_theme_mode_' + activeUid)) || localStorage.getItem('simcha_theme_mode') || 'dark';
        if (savedTheme === 'light') {
          document.documentElement.classList.add('light-mode');
        } else {
          document.documentElement.classList.remove('light-mode');
        }
        document.documentElement.classList.remove('outline-mode');
      } catch (e) {}
    </script>
    <script type="module">
      const mapsKey = import.meta.env.VITE_GOOGLE_MAPS_PLATFORM_KEY;
      if (mapsKey && typeof mapsKey === 'string' && !mapsKey.startsWith("%") && !window.google?.maps?.places) {
        const script = document.createElement('script');
        script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(mapsKey)}&libraries=places`;
        script.async = false;
        document.head.appendChild(script);
      }
    </script>
  </head>
  <body class="bg-black text-slate-100">
    <div id="root">
      <main class="min-h-screen bg-black flex flex-col items-center justify-center" aria-label="Loading Simcha Booking">
        <img src="/sb-logo-old-gold.png?v=5" alt="Simcha Booking" class="simcha-logo-svg w-16 h-16 object-contain select-none bg-transparent border-0 shadow-none mb-8 animate-pulse" />
        <svg class="w-8 h-8 text-[#D4AF37] animate-spin" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-6.219-8.56" />
        </svg>
      </main>
    </div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
